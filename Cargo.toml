[package]
name = "guitarfx"
version = "0.1.0"
edition = "2021"
authors = ["Thaaan184"]
description = "Lightweight Terminal Guitar Effects Engine in Rust"

[dependencies]
cpal = "0.15"
ringbuf = "0.4"
crossterm = "0.27"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
