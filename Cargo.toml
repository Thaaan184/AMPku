[package]
name = "ampku"
version = "0.1.0"
edition = "2021"
authors = ["Thaaan184"]
description = "Standalone Low-Latency Guitar & Vocal DSP Studio"

[dependencies]
cpal = "0.15"
eframe = "0.27"
egui = "0.27"
hound = "3.5"
rtrb = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
