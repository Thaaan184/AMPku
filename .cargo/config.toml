[target.x86_64-unknown-linux-gnu]
rustflags = ["-L", "/home/ids/.local/lib"]

# Windows cross-compilation target configuration (MinGW GNU)
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-ar"
# runner = "wine64" # Uncomment to execute Windows test binaries on Linux via Wine

# Windows MSVC target configuration (for building natively on Windows or via cargo-xwin)
[target.x86_64-pc-windows-msvc]
# linker = "link.exe"
